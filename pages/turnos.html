<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../estilos/estilos.css">
    <script src="../js/javascripts.js" defer></script>
    <title>Reserva de Turnos - Huellas Felices</title>
</head>
<body>

    <nav class="navbar">
        <div class="nav-links">
            <a href="../index.html">Inicio</a>
            <a href="usuarios.html" class="dueño" style="display: none;">Usuarios</a>
            <a href="turnos.html" class="cliente empleado dueño" style="display: none;">Turnos</a>
            <a href="historial.html" class="cliente empleado dueño" style="display: none;">Historial</a>
        </div>

        <div class="nav-auth">
            <span class="visitante">
                <a href="login.html" class="btn-login">Iniciar Sesión</a>
            </span>
            <span class="cliente empleado dueño" style="display: none;">
                <span id="nombre-usuario-nav" style="margin-right: 10px; font-weight: bold;"></span>
                <a href="#" id="btn-logout" class="btn-logout">Cerrar Sesión</a>
            </span>
        </div>
    </nav>

    <header>
        Trabajo PPI - Hotel de Mascotas
    </header>

    <main>
        <h1>Solicitar Reserva de Estadía</h1>

        <form id="form-turno">
            <label for="input-nombre">Nombre del Responsable:</label>
            <input type="text" id="input-nombre" placeholder="Tu nombre" required>

            <label for="input-mascota">Nombre de la Mascota:</label>
            <input type="text" id="input-mascota" placeholder="Nombre de tu perro o gato" required>

            <label for="select-tamano">Tamaño de la Mascota:</label>
            <select id="select-tamano" required>
                <option value="" disabled selected>Selecciona una opción</option>
                <option value="Pequeño (hasta 10kg)">Pequeño (hasta 10 kg)</option>
                <option value="Mediano (10 a 25kg)">Mediano (10 a 25 kg)</option>
                <option value="Grande (más de 25kg)">Grande (más de 25 kg)</option>
            </select>

            <label for="select-alojamiento">Tipo de Alojamiento:</label>
            <select id="select-alojamiento" required>
                <option value="" disabled selected>Selecciona el tipo de alojamiento</option>
                <option value="Canil Estándar">Canil Estándar (Ideal perros medianos/grandes)</option>
                <option value="Suite VIP">Suite VIP (Espacio amplio con aire/calefacción)</option>
                <option value="Espacio Felino">Espacio Felino (Exclusivo para gatos)</option>
            </select>

            <label for="input-fecha-ingreso">Fecha de Ingreso:</label>
            <input type="date" id="input-fecha-ingreso" required>

            <label for="input-fecha-egreso">Fecha de Egreso:</label>
            <input type="date" id="input-fecha-egreso" required>

            <div id="info-cupos" style="background-color: #e9ecef; padding: 10px; border-radius: 5px; font-weight: bold; text-align: center;">
                Cupos disponibles para este alojamiento: <span id="cupos-numero">5</span>
            </div>

            <button type="submit" style="margin-top: 15px;">Confirmar Reserva y Generar Voucher</button>
        </form>
    </main>

    <footer>
        Información - Huellas Felices
    </footer>

</body>
</html>
